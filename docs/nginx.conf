# nginx serving the documentation site (docs/Dockerfile). The same files answer
# at / (its own domain, e.g. docs.example.com) and at /docs/ (forwarded by the
# Pflanzn frontend, which passes the path on unchanged). The
# Content-Security-Policy lets the pages load nothing from elsewhere.
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # /guide/plants redirects to /guide/plants/ with a relative Location, so it
    # also works behind a proxy and under /docs/.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Pages and unhashed assets (assets/extra.css, fonts, screenshots) keep
    # their names across builds, so the browser revalidates them on every load
    # (a cheap 304 through the ETag) and a new image shows at once.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /docs {
        return 301 /docs/;
    }

    # Under the app: /docs/x is the site's /x.
    location /docs/ {
        alias /usr/share/nginx/html/;
        error_page 404 /docs/404.html;
    }

    # MkDocs writes the 404 page with root-absolute links (it can be shown at
    # any depth), so under /docs/ they get the prefix.
    location = /docs/404.html {
        internal;
        alias /usr/share/nginx/html/404.html;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'href="/' 'href="/docs/';
        sub_filter 'src="/' 'src="/docs/';
    }

    # Material's bundles carry a content hash in their name, so they can be
    # kept for good. nginx drops inherited add_header lines once a block sets
    # its own, so the security headers are repeated here.
    # Quoted: nginx reads an unquoted { as the start of the block.
    location ~ "^(/docs)?/assets/(stylesheets|javascripts)/.+\.[0-9a-f]{8}\.min\.(css|js)$" {
        rewrite ^/docs(/.*)$ $1 break;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    error_page 404 /404.html;
}
