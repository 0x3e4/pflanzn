# Headers for the app itself (index.html, the build assets, the PWA files). Responses
# from the backend (/api, /mcp) carry the backend's own headers.
#
# Included in every location that serves the app, because nginx drops the add_header
# lines of the enclosing block as soon as a location adds one of its own (Cache-Control).
#
# CSP: everything comes from this origin, except
#   - Leaflet (script and stylesheet, pinned by SRI) from unpkg.com for the location maps,
#   - images: OpenStreetMap tiles and Pl@ntNet's reference photos in identification
#     results come from other hosts, so any https image is allowed (images can't run code),
#   - style-src 'unsafe-inline': React and Leaflet set style attributes.
# frame-ancestors comes from FRAME_ANCESTORS ('none' unless set), see nginx.conf.template.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $frame_ancestors" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Location pages and the weather zones ask for the position; nothing else needs a device API.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
